name: AI Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal/alpha/beta/production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      skip_deploy:
        description: 'Skip Play Store deployment'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Xmx2048m'

jobs:
  ai-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false
      
      - name: Decode Play Store Key
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          if [ -n "$PLAY_STORE_B64" ] && [ "$PLAY_STORE_B64" != "" ]; then
            echo "$PLAY_STORE_B64" | base64 -d > play-store-key.json
            echo "✅ Play Store key decoded"
          else
            echo "⚠️  PLAY_STORE_JSON_BASE64 secret not set, Play Store deployment will be skipped"
          fi
      
      - name: Determine previous tag
        id: tags
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~10 2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=""
          fi
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
          echo "Current ref: ${{ github.ref }}"
      
      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      
      - name: Run AI Release Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          SKIP_DEPLOY="${{ github.event.inputs.skip_deploy }}"
          if [ "$SKIP_DEPLOY" == "true" ] || [ -z "$PLAY_STORE_B64" ] || [ "$PLAY_STORE_B64" == "" ]; then
            export DRY_RUN=true
          fi
          
          ./gradlew aiRelease \
            -PpreviousTag="${{ steps.tags.outputs.previous_tag }}" \
            -Ptrack="${{ github.event.inputs.track || 'internal' }}" \
            --no-daemon \
            --stacktrace
      
      - name: Build Release APK
        run: |
          echo "Building unsigned release APK"
          ./gradlew :app:assembleRelease --no-daemon
          echo "✅ Release APK built (unsigned)"
      
      - name: Find and rename APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Found unsigned APK, renaming to app-release.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Found APK"
          else
            echo "❌ APK not found"
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
      
      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/release-artifacts/
          if-no-files-found: warn
          retention-days: 30
      
      - name: Check Release Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Checking release artifacts..."
          
          # Создаем директорию если не существует
          mkdir -p app/build/release-artifacts
          
          # Проверяем RELEASE_NOTES.md
          if [ -f "app/build/release-artifacts/RELEASE_NOTES.md" ]; then
            echo "✅ RELEASE_NOTES.md exists"
            ls -lh app/build/release-artifacts/RELEASE_NOTES.md
          else
            echo "⚠️  RELEASE_NOTES.md not found, creating placeholder"
            echo "# Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/RELEASE_NOTES.md
            echo "" >> app/build/release-artifacts/RELEASE_NOTES.md
            echo "Release notes will be generated by AI pipeline." >> app/build/release-artifacts/RELEASE_NOTES.md
          fi
          
          # Проверяем наличие файлов для загрузки
          echo ""
          echo "Checking files for release:"
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK found: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "⚠️  APK not found"
          fi
          
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB found: $(ls -lh app/build/outputs/bundle/release/app-release.aab | awk '{print $5}')"
          else
            echo "⚠️  AAB not found"
          fi
          
          # Создаем placeholder файлы если их нет
          if [ ! -f "app/build/release-artifacts/play-store-ru.txt" ]; then
            echo "Creating placeholder play-store-ru.txt"
            echo "Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/play-store-ru.txt
          fi
          
          if [ ! -f "app/build/release-artifacts/play-store-en.txt" ]; then
            echo "Creating placeholder play-store-en.txt"
            echo "Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/play-store-en.txt
          fi
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "Creating GitHub Release for tag: $TAG_NAME"
          
          # Проверяем наличие файлов
          FILES_TO_ATTACH=""
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            FILES_TO_ATTACH="$FILES_TO_ATTACH app/build/outputs/apk/release/app-release.apk"
            echo "✅ APK found: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "⚠️  APK not found"
          fi
          
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            FILES_TO_ATTACH="$FILES_TO_ATTACH app/build/outputs/bundle/release/app-release.aab"
            echo "✅ AAB found: $(ls -lh app/build/outputs/bundle/release/app-release.aab | awk '{print $5}')"
          else
            echo "⚠️  AAB not found"
          fi
          
          # Читаем release notes
          if [ -f "app/build/release-artifacts/RELEASE_NOTES.md" ]; then
            BODY_FILE="app/build/release-artifacts/RELEASE_NOTES.md"
            echo "✅ Using RELEASE_NOTES.md"
          else
            echo "⚠️  RELEASE_NOTES.md not found, creating placeholder"
            echo "# Release $VERSION" > /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
            echo "Release $VERSION" >> /tmp/release_notes.md
            BODY_FILE="/tmp/release_notes.md"
          fi
          
          # Создаем release через GitHub CLI (более надежно чем action)
          if command -v gh &> /dev/null; then
            echo "Using GitHub CLI to create release..."
            if [ -n "$FILES_TO_ATTACH" ]; then
              gh release create "$TAG_NAME" \
                --title "Release $VERSION" \
                --notes-file "$BODY_FILE" \
                $FILES_TO_ATTACH \
                --latest \
                --repo "${{ github.repository }}"
            else
              echo "⚠️  No files to attach, creating release without files"
              gh release create "$TAG_NAME" \
                --title "Release $VERSION" \
                --notes-file "$BODY_FILE" \
                --latest \
                --repo "${{ github.repository }}"
            fi
          else
            echo "⚠️  GitHub CLI not available, skipping release creation"
            echo "Files are available in artifacts"
          fi
      
      - name: Create GitHub Release (Fallback Action)
        if: startsWith(github.ref, 'refs/tags/') && failure()
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: app/build/release-artifacts/RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup
        if: always()
        run: |
          rm -f play-store-key.json
          echo "✅ Cleanup completed"
