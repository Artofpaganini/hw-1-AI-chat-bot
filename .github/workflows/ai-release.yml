name: AI Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal/alpha/beta/production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      skip_deploy:
        description: 'Skip Play Store deployment'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Xmx2048m'

jobs:
  ai-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false
      
      - name: Decode Keystore
        id: keystore
        continue-on-error: true
        run: |
          KEYSTORE_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KEYSTORE_B64" ] || [ "$KEYSTORE_B64" = "" ]; then
            echo "⚠️  KEYSTORE_BASE64 secret not set, signing will be skipped"
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Starting keystore decoding..."
          echo "Base64 length: ${#KEYSTORE_B64} characters"
          
          # Убираем ВСЕ whitespace символы из base64 строки (более агрессивно)
          KEYSTORE_B64_CLEAN=$(echo -n "$KEYSTORE_B64" | tr -d '\n\r\t ' | sed 's/[[:space:]]//g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -o '[A-Za-z0-9+/=]*')
          
          echo "Cleaned base64 length: ${#KEYSTORE_B64_CLEAN} characters"
          
          # Проверяем, что base64 не пустой после очистки
          if [ -z "$KEYSTORE_B64_CLEAN" ] || [ "$KEYSTORE_B64_CLEAN" = "" ]; then
            echo "❌ Error: Base64 string is empty after cleaning"
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Используем Python для более надежного декодирования base64
          # Сохраняем base64 во временный файл и читаем оттуда
          echo -n "$KEYSTORE_B64_CLEAN" > /tmp/keystore_b64_input.txt
          
          python3 << 'PYTHON_EOF'
          import base64
          import sys
          import re
          
          try:
              # Читаем base64 из файла
              with open('/tmp/keystore_b64_input.txt', 'r') as f:
                  b64_str = f.read().strip()
              
              if not b64_str:
                  print("❌ Error: Base64 string is empty")
                  sys.exit(1)
              
              # Убираем все whitespace и не-base64 символы
              b64_str = re.sub(r'[^A-Za-z0-9+/=]', '', b64_str)
              
              if not b64_str:
                  print("❌ Error: Base64 string contains no valid characters")
                  sys.exit(1)
              
              # Добавляем padding если нужно (base64 должен быть кратен 4)
              missing_padding = len(b64_str) % 4
              if missing_padding:
                  padding_needed = 4 - missing_padding
                  b64_str += '=' * padding_needed
                  print(f"Added {padding_needed} padding characters")
              
              print(f"Base64 length after cleaning: {len(b64_str)}")
              
              # Декодируем
              try:
                  keystore_bytes = base64.b64decode(b64_str, validate=True)
              except Exception as decode_error:
                  print(f"❌ Error: Failed to decode base64: {decode_error}")
                  print(f"Base64 length: {len(b64_str)}")
                  print(f"First 100 chars: {b64_str[:100]}...")
                  print(f"Last 100 chars: ...{b64_str[-100:]}")
                  sys.exit(1)
              
              # Записываем в файл
              with open('keystore.jks', 'wb') as f:
                  f.write(keystore_bytes)
              
              print(f"✅ Keystore decoded successfully (size: {len(keystore_bytes)} bytes)")
              sys.exit(0)
          except Exception as e:
              print(f"❌ Error decoding base64: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          finally:
              # Удаляем временный файл
              import os
              try:
                  os.remove('/tmp/keystore_b64_input.txt')
              except:
                  pass
          PYTHON_EOF
          
          DECODE_EXIT_CODE=$?
          
          if [ $DECODE_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: Failed to decode base64 using Python"
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Проверяем, что файл создан
          if [ ! -f keystore.jks ]; then
            echo "❌ Error: keystore.jks file was not created"
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Проверяем размер файла
          KEYSTORE_SIZE=$(stat -f%z keystore.jks 2>/dev/null || stat -c%s keystore.jks 2>/dev/null || echo "0")
          if [ "$KEYSTORE_SIZE" -eq 0 ]; then
            echo "❌ Error: keystore.jks file is empty (0 bytes)"
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Keystore file created (size: $KEYSTORE_SIZE bytes)"
          
          # Проверяем валидность keystore с паролем
          STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          
          if [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Validating keystore with provided password..."
            VALIDATION_OUTPUT=$(keytool -list -v -keystore keystore.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" 2>&1)
            VALIDATION_EXIT=$?
            
            if [ $VALIDATION_EXIT -eq 0 ]; then
              echo "✅ Keystore is valid and password is correct"
              echo "✅ Key alias '$KEY_ALIAS' found in keystore"
              echo "keystore_available=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Error: Keystore validation failed!"
              echo "Exit code: $VALIDATION_EXIT"
              echo "Error output:"
              echo "$VALIDATION_OUTPUT" | head -10
              echo ""
              echo "This usually means:"
              echo "  1. Wrong SIGNING_STORE_PASSWORD"
              echo "  2. Wrong SIGNING_KEY_ALIAS"
              echo "  3. Corrupted keystore file"
              echo ""
              echo "Trying to list all aliases in keystore..."
              if keytool -list -keystore keystore.jks -storepass "$STORE_PASS" 2>&1 | head -20; then
                echo "Keystore can be opened, but alias '$KEY_ALIAS' not found"
              else
                echo "Cannot open keystore with provided password"
              fi
              echo "keystore_available=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "⚠️  Warning: Cannot validate keystore (missing password or alias)"
            echo "keystore_available=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Decode Play Store Key
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          if [ -n "$PLAY_STORE_B64" ] && [ "$PLAY_STORE_B64" != "" ]; then
            echo "$PLAY_STORE_B64" | base64 -d > play-store-key.json
            echo "✅ Play Store key decoded"
          else
            echo "⚠️  PLAY_STORE_JSON_BASE64 secret not set, Play Store deployment will be skipped"
          fi
      
      - name: Determine previous tag
        id: tags
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~10 2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=""
          fi
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
          echo "Current ref: ${{ github.ref }}"
      
      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      
      - name: Run AI Release Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          SKIP_DEPLOY="${{ github.event.inputs.skip_deploy }}"
          if [ "$SKIP_DEPLOY" == "true" ] || [ -z "$PLAY_STORE_B64" ] || [ "$PLAY_STORE_B64" == "" ]; then
            export DRY_RUN=true
          fi
          # Пропускаем signing если keystore недоступен
          if [ "${{ steps.keystore.outputs.keystore_available }}" != "true" ]; then
            echo "⚠️  Keystore not available, skipping signing in release pipeline"
          fi
          ./gradlew aiRelease \
            -PpreviousTag="${{ steps.tags.outputs.previous_tag }}" \
            -Ptrack="${{ github.event.inputs.track || 'internal' }}" \
            --no-daemon \
            --stacktrace
      
      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.keystore_available }}" = "true" ] && [ -f "keystore.jks" ]; then
            echo "✅ Keystore is available, building signed APK"
            ./gradlew :app:assembleRelease --no-daemon
            echo "✅ Release APK built and signed"
          else
            echo "⚠️  Keystore not available or invalid, building unsigned APK"
            echo "⚠️  This APK cannot be published to Play Store"
            ./gradlew :app:assembleRelease --no-daemon
          fi
      
      - name: Find and rename APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Found signed APK"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "⚠️  Found unsigned APK, renaming to app-release.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          else
            echo "❌ APK not found"
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
      
      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/release-artifacts/
          if-no-files-found: warn
          retention-days: 30
      
      - name: Check Release Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Checking release artifacts..."
          
          # Создаем директорию если не существует
          mkdir -p app/build/release-artifacts
          
          # Проверяем RELEASE_NOTES.md
          if [ -f "app/build/release-artifacts/RELEASE_NOTES.md" ]; then
            echo "✅ RELEASE_NOTES.md exists"
            ls -lh app/build/release-artifacts/RELEASE_NOTES.md
          else
            echo "⚠️  RELEASE_NOTES.md not found, creating placeholder"
            echo "# Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/RELEASE_NOTES.md
            echo "" >> app/build/release-artifacts/RELEASE_NOTES.md
            echo "Release notes will be generated by AI pipeline." >> app/build/release-artifacts/RELEASE_NOTES.md
          fi
          
          # Проверяем наличие файлов для загрузки
          echo ""
          echo "Checking files for release:"
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK found: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          else
            echo "⚠️  APK not found"
          fi
          
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB found: $(ls -lh app/build/outputs/bundle/release/app-release.aab | awk '{print $5}')"
          else
            echo "⚠️  AAB not found"
          fi
          
          # Создаем placeholder файлы если их нет
          if [ ! -f "app/build/release-artifacts/play-store-ru.txt" ]; then
            echo "Creating placeholder play-store-ru.txt"
            echo "Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/play-store-ru.txt
          fi
          
          if [ ! -f "app/build/release-artifacts/play-store-en.txt" ]; then
            echo "Creating placeholder play-store-en.txt"
            echo "Release ${{ steps.version.outputs.version }}" > app/build/release-artifacts/play-store-en.txt
          fi
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: app/build/release-artifacts/RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/release-artifacts/play-store-ru.txt
            app/build/release-artifacts/play-store-en.txt
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup
        if: always()
        run: |
          rm -f keystore.jks
          rm -f play-store-key.json
          echo "✅ Cleanup completed"
