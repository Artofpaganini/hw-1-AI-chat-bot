name: AI Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal/alpha/beta/production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      skip_deploy:
        description: 'Skip Play Store deployment'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Xmx2048m'

jobs:
  ai-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false
      
      - name: Decode Keystore
        run: |
          KEYSTORE_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KEYSTORE_B64" ] || [ "$KEYSTORE_B64" = "" ]; then
            echo "⚠️  KEYSTORE_BASE64 secret not set, signing will be skipped"
            exit 0
          fi
          
          echo "Starting keystore decoding..."
          echo "Base64 length: ${#KEYSTORE_B64} characters"
          
          # Убираем все пробелы, переносы строк, табуляции из base64 строки
          KEYSTORE_B64_CLEAN=$(echo -n "$KEYSTORE_B64" | tr -d '\n\r\t ' | sed 's/[[:space:]]//g')
          
          echo "Cleaned base64 length: ${#KEYSTORE_B64_CLEAN} characters"
          
          # Проверяем, что base64 не пустой после очистки
          if [ -z "$KEYSTORE_B64_CLEAN" ] || [ "$KEYSTORE_B64_CLEAN" = "" ]; then
            echo "❌ Error: Base64 string is empty after cleaning"
            exit 1
          fi
          
          # Декодируем base64 в keystore
          echo "$KEYSTORE_B64_CLEAN" | base64 -d > keystore.jks 2>&1
          DECODE_EXIT_CODE=$?
          
          if [ $DECODE_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: Failed to decode base64. Exit code: $DECODE_EXIT_CODE"
            echo "First 100 chars of base64: ${KEYSTORE_B64_CLEAN:0:100}..."
            exit 1
          fi
          
          # Проверяем, что файл создан
          if [ ! -f keystore.jks ]; then
            echo "❌ Error: keystore.jks file was not created"
            exit 1
          fi
          
          # Проверяем размер файла
          KEYSTORE_SIZE=$(stat -f%z keystore.jks 2>/dev/null || stat -c%s keystore.jks 2>/dev/null || echo "0")
          if [ "$KEYSTORE_SIZE" -eq 0 ]; then
            echo "❌ Error: keystore.jks file is empty (0 bytes)"
            exit 1
          fi
          
          echo "✅ Keystore decoded successfully (size: $KEYSTORE_SIZE bytes)"
          
          # Проверяем, что это действительно keystore файл (начинается с магических байтов)
          FIRST_BYTES=$(head -c 4 keystore.jks | od -An -tx1 | tr -d ' \n')
          echo "First 4 bytes (hex): $FIRST_BYTES"
          
          # Проверяем валидность keystore с паролем
          STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          
          if [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Validating keystore with provided password..."
            if keytool -list -v -keystore keystore.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "✅ Keystore is valid and password is correct"
              echo "✅ Key alias '$KEY_ALIAS' found in keystore"
            else
              echo "❌ Error: Keystore validation failed!"
              echo "This usually means:"
              echo "  1. Wrong SIGNING_STORE_PASSWORD"
              echo "  2. Wrong SIGNING_KEY_ALIAS"
              echo "  3. Corrupted keystore file"
              echo ""
              echo "Trying to list all aliases in keystore..."
              if keytool -list -keystore keystore.jks -storepass "$STORE_PASS" 2>&1 | head -20; then
                echo "Keystore can be opened, but alias '$KEY_ALIAS' not found"
              else
                echo "Cannot open keystore with provided password"
              fi
              exit 1
            fi
          else
            echo "⚠️  Warning: Cannot validate keystore (missing password or alias)"
          fi
      
      - name: Decode Play Store Key
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          if [ -n "$PLAY_STORE_B64" ] && [ "$PLAY_STORE_B64" != "" ]; then
            echo "$PLAY_STORE_B64" | base64 -d > play-store-key.json
            echo "✅ Play Store key decoded"
          else
            echo "⚠️  PLAY_STORE_JSON_BASE64 secret not set, Play Store deployment will be skipped"
          fi
      
      - name: Determine previous tag
        id: tags
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~10 2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=""
          fi
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
          echo "Current ref: ${{ github.ref }}"
      
      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      
      - name: Run AI Release Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          PLAY_STORE_B64="${{ secrets.PLAY_STORE_JSON_BASE64 }}"
          SKIP_DEPLOY="${{ github.event.inputs.skip_deploy }}"
          if [ "$SKIP_DEPLOY" == "true" ] || [ -z "$PLAY_STORE_B64" ] || [ "$PLAY_STORE_B64" == "" ]; then
            export DRY_RUN=true
          fi
          ./gradlew aiRelease \
            -PpreviousTag="${{ steps.tags.outputs.previous_tag }}" \
            -Ptrack="${{ github.event.inputs.track || 'internal' }}" \
            --no-daemon \
            --stacktrace
      
      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -f "keystore.jks" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            echo "✅ Release APK built and signed"
          else
            echo "⚠️  Keystore not found, building unsigned APK"
            ./gradlew :app:assembleRelease --no-daemon
          fi
      
      - name: Find and rename APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Found signed APK"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "⚠️  Found unsigned APK, renaming to app-release.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          else
            echo "❌ APK not found"
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
      
      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/release-artifacts/
          if-no-files-found: warn
          retention-days: 30
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: app/build/release-artifacts/RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/release-artifacts/play-store-ru.txt
            app/build/release-artifacts/play-store-en.txt
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup
        if: always()
        run: |
          rm -f keystore.jks
          rm -f play-store-key.json
          echo "✅ Cleanup completed"
